
name: Actualizar MI IPTV MUNDIAL

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Actualizar canales, películas y series
        run: python actualizar_lista.py
        env:
          REGIOFLIX_URL: ${{ secrets.REGIOFLIX_URL }}


      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lista.m3u canales.m3u catalogo_vod.m3u peliculas.m3u series.m3u
          git diff --cached --quiet && exit 0
          git pull --rebase origin main
          git push origin main
